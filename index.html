<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郭先生侘寂美學空間 — 工程紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-bg: #f5f0e8;      /* 生成白 */
            --color-text: #3d352d;    /* 墨染灰 */
            --color-accent: #5a4d3f;  /* 焦茶 */
            --color-muted: #a8a29e;
            --font-main: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 4rem 2rem 2rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 0.2rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--color-accent);
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        #timeline {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
        }

        .date-group {
            margin-bottom: 4rem;
        }

        .date-header {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--color-muted);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .date-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--color-muted);
            opacity: 0.3;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .log-card {
            background: transparent;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .log-card:hover {
            transform: translateY(-5px);
        }

        .photo-container {
            aspect-ratio: 4/3;
            overflow: hidden;
            background: #e0dbd5;
            margin-bottom: 1rem;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .log-card:hover img {
            filter: brightness(0.9);
        }

        .log-info {
            font-size: 0.9rem;
        }

        /* 紀錄人（誰上傳的） */
        .log-by {
            display: block;
            font-size: 0.75rem;
            color: #8a8070;
            margin-top: 0.15rem;
        }
        .progress-by {
            font-size: 0.75rem;
            color: #8a8070;
        }

        .log-location {
            font-weight: 500;
            display: block;
            margin-bottom: 0.2rem;
        }

        .log-status {
            font-size: 0.75rem;
            color: var(--color-muted);
            text-transform: uppercase;
        }

        /* 項目進度對照 */
        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1rem;
            color: var(--color-accent);
            margin: 0 0 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--color-muted);
            opacity: 0.85;
        }

        #progress {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .progress-item {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(168, 162, 158, 0.25);
        }

        .progress-head {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .progress-title { font-size: 1.05rem; font-weight: 500; }

        .progress-loc { font-size: 0.8rem; color: var(--color-accent); opacity: 0.75; }

        .progress-count { font-size: 0.75rem; color: var(--color-muted); margin-left: auto; }

        .chip {
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
            border-radius: 10px;
            background: rgba(168, 162, 158, 0.25);
            color: var(--color-accent);
        }
        .chip.done { background: rgba(107, 142, 92, 0.25); color: #4a6b3d; }
        .chip.doing { background: rgba(191, 139, 46, 0.22); color: #8a6a1e; }
        .chip.paused { background: rgba(139, 46, 46, 0.15); color: #8b5454; }

        /* 可左右滑動的照片時間軸 */
        .strip {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.75rem;
            -webkit-overflow-scrolling: touch;
        }

        .shot {
            flex: 0 0 auto;
            width: 200px;
            margin: 0;
            position: relative;
            cursor: pointer;
        }

        .shot img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            display: block;
            background: #e0dbd5;
            transition: filter 0.3s ease;
        }

        .shot:hover img { filter: brightness(0.9); }

        .shot figcaption {
            font-size: 0.72rem;
            color: var(--color-muted);
            margin-top: 0.4rem;
            line-height: 1.35;
        }

        .tag {
            position: absolute;
            top: 0.4rem;
            left: 0.4rem;
            font-size: 0.65rem;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            background: rgba(61, 53, 45, 0.75);
            color: #f5f0e8;
        }
        .tag.latest { background: rgba(107, 142, 92, 0.9); }

        /* Modal 裡的多張照片 */
        .modal-shots { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
        .modal-shot img { width: 100%; max-height: 55vh; object-fit: contain; background: #eee; display: block; }
        .modal-shot figcaption { font-size: 0.8rem; color: var(--color-muted); margin-top: 0.4rem; }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(61, 53, 45, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--color-bg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--color-text);
        }

        .modal-img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #eee;
            margin-bottom: 2rem;
        }

        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .detail-item {
            margin-bottom: 1rem;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--color-muted);
            display: block;
        }

        .detail-value {
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .modal-details { grid-template-columns: 1fr; }
            header { padding: 2rem 1rem 1rem; }
        }

        .loading {
            text-align: center;
            padding: 5rem;
            font-weight: 300;
            color: var(--color-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>郭先生侘寂美學空間</h1>
        <div class="subtitle">工程日誌 — 在不完美中記錄成長</div>
    </header>

    <section id="progress">
        <h2 class="section-title">項目進度對照</h2>
        <div id="progressList"><div class="loading">正在讀取紀錄...</div></div>
    </section>

    <div id="timeline">
        <h2 class="section-title">依日期瀏覽</h2>
        <div class="loading">正在讀取紀錄...</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-shots" class="modal-shots"></div>
            <div class="modal-details" id="modal-details"></div>
        </div>
    </div>

    <script>

        // Supabase Configuration
        const SUPABASE_URL = 'https://mnhtegouhzfhigydvgwd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZMU29KQPn0xuBadGJq6Zwg_cHpWe7ZZ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 目前載入的紀錄，供 modal 以索引取用
        // （原本把 JSON.stringify 塞進 onclick 屬性，遇到引號就會壞掉）
        let allLogs = [];

        // 照片已經在 fetchLogs 裡自己接到 log.photos 上（視圖之間沒有外鍵可嵌入）
        function firstPhoto(log) {
            return (log && Array.isArray(log.photos) && log.photos.length)
                ? log.photos[0] : {};
        }

        // 轉義，避免描述裡的 < > & " 破壞版面
        function esc(v) {
            if (v === null || v === undefined) return '';
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        const PLACEHOLDER_CARD = 'https://via.placeholder.com/400x300?text=No+Image';
        const PLACEHOLDER_MODAL = 'https://via.placeholder.com/800x600?text=No+Image';

        // 狀態標籤（公開頁不顯示專案費用與負責人）
        const STATUS_LABEL = { '': '開案', completed: '已完成', in_progress: '進行中', paused: '暫停' };
        const STATUS_CLASS = { '': 'opened', completed: 'done', in_progress: 'doing', paused: 'paused' };

        // 紀錄人是後加的欄位，公開頁用「外掛視圖」讀（v_public_logs_ext / v_public_photos_ext）。
        // SQL 還沒跑的話就自動退回原本的視圖（只是不會顯示紀錄人）—— 不會壞掉，也不需要偵測。
        async function fetchLogs() {
            async function pull(logsView, photosView) {
                const [l, p] = await Promise.all([
                    supabaseClient.from(logsView).select('*').order('log_date', { ascending: false }),
                    supabaseClient.from(photosView).select('*')
                ]);
                return { l, p };
            }
            let { l: logsRes, p: photosRes } = await pull('v_public_logs_ext', 'v_public_photos_ext');
            if (logsRes.error || photosRes.error) {
                ({ l: logsRes, p: photosRes } = await pull('v_public_logs', 'v_public_photos'));
            }
            if (logsRes.error || photosRes.error) {
                console.error('Error fetching logs:', logsRes.error || photosRes.error);
                const msg = '<div class="loading">讀取失敗，請稍後再試。</div>';
                document.getElementById('timeline').innerHTML = msg;
                document.getElementById('progressList').innerHTML = msg;
                return;
            }

            // 視圖之間沒有外鍵可以嵌入，所以兩邊各撈一次，在這裡用 log_id 接起來
            const byLog = new Map();
            for (const p of (photosRes.data || [])) {
                if (!byLog.has(p.log_id)) byLog.set(p.log_id, []);
                byLog.get(p.log_id).push(p);
            }
            allLogs = (logsRes.data || []).map(l => ({
                ...l,
                photos: (byLog.get(l.id) || []).sort(photoOrder)
            }));

            renderProgress(allLogs);
            renderLogs(allLogs);
        }

        // 照片順序：sort_order → 上傳時間 → 檔名裡的毫秒
        // ⚠️ 舊資料的 sort_order 全是 0（不是 null），只比 sort_order 會得到 0 ＝「相等」，
        //    等於沿用 API 回傳的順序 → 卡片上的第一張照片其實是隨機的。
        //    同一批上傳的照片 created_at 也會一模一樣，所以最後再用檔名裡的毫秒決勝。
        function uploadSeq(p) {
            const m = String((p && p.photo_url) || '').match(/\/(\d{13})-[a-z0-9]+\./i);
            return m ? Number(m[1]) : Number.MAX_SAFE_INTEGER;
        }

        function photoOrder(a, b) {
            const sa = (a.sort_order === null || a.sort_order === undefined) ? 0 : a.sort_order;
            const sb = (b.sort_order === null || b.sort_order === undefined) ? 0 : b.sort_order;
            if (sa !== sb) return sa - sb;
            const ca = a.created_at || '', cb = b.created_at || '';
            if (ca !== cb) return ca < cb ? -1 : 1;
            return uploadSeq(a) - uploadSeq(b);
        }

        function renderLogs(logs) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            if (!logs || logs.length === 0) {
                timeline.innerHTML = '<div class="loading">目前尚無紀錄。</div>';
                return;
            }

            // 依日期分組
            const groups = logs.reduce((acc, log) => {
                const date = log.log_date || '未標記日期';
                if (!acc[date]) acc[date] = [];
                acc[date].push(log);
                return acc;
            }, {});

            Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'date-group';

                const cards = groups[date].map(log => {
                    const photo = firstPhoto(log);
                    const idx = logs.indexOf(log);
                    return `
                                <div class="log-card" onclick="showDetail(${idx})">
                                    <div class="photo-container">
                                        <img src="${esc(photo.photo_url) || PLACEHOLDER_CARD}" loading="lazy">
                                    </div>
                                    <div class="log-info">
                                        <span class="log-location">${esc(log.node_name || log.location) || '未標記位置'}</span>
                                        <span class="log-status">${esc(STATUS_LABEL[log.item_status || log.progress_status] || '')}</span>
                                        ${log.recorder_name ? `<span class="log-by">紀錄：${esc(log.recorder_name)}</span>` : ''}
                                    </div>
                                </div>`;
                }).join('');

                groupDiv.innerHTML = `
                            <div class="date-header">${esc(date)}</div>
                            <div class="grid">${cards}</div>
                        `;
                timeline.appendChild(groupDiv);
            });
        }

        // 項目進度對照：每個項目一條可左右滑動的照片時間軸（全部顯示，含進行中）
        function renderProgress(logs) {
            const box = document.getElementById('progressList');
            if (!box) return;

            const withItem = logs.filter(l => l.item_id && l.photos && l.photos.length);
            if (!withItem.length) {
                box.innerHTML = '<div class="loading">還沒有指定項目的紀錄。</div>';
                return;
            }

            const groups = new Map();
            for (const l of withItem) {
                if (!groups.has(l.item_id)) groups.set(l.item_id, []);
                groups.get(l.item_id).push(l);
            }

            let html = '';
            for (const list of groups.values()) {
                // 舊 → 新：時間軸由左到右就是施工的過程
                const sorted = [...list].sort((a, b) =>
                    String(a.log_date || '').localeCompare(String(b.log_date || '')));
                const last = sorted[sorted.length - 1];
                const title = last.item_title || '（未命名項目）';
                const loc = last.node_name || last.location || '';
                const st = last.item_status || last.progress_status;
                const stLabel = STATUS_LABEL[st] || '未設定';
                const stCls = STATUS_CLASS[st] || '';

                // 這個案子有幾個人做過（同一案件可能由不同紀錄人上傳）
                const byNames = [...new Set(sorted.map(x => x.recorder_name).filter(Boolean))];
                let shots = 0;
                const cells = [];
                sorted.forEach((log, i) => {
                    const multi = sorted.length > 1;
                    const tag = multi && i === 0 ? '<span class="tag">起點</span>'
                              : (multi && i === sorted.length - 1 ? '<span class="tag latest">最新</span>' : '');
                    log.photos.forEach(ph => {
                        shots++;
                        // 照片上標明是誰拍的／誰做的（補拍會讓不同人加到同一筆紀錄）
                        // 日期優先用「照片自己的拍攝日期」，沒有才退回紀錄日期
                        const cap = [ph.taken_at || log.log_date, ph.recorder_name || log.recorder_name,
                                     ph.photo_description].filter(Boolean).join(' · ');
                        cells.push(`<figure class="shot" onclick="showDetailById('${esc(log.id)}')">
                            ${tag}
                            <img src="${esc(ph.photo_url)}" loading="lazy" alt="">
                            <figcaption>${esc(cap)}</figcaption>
                        </figure>`);
                    });
                });

                html += `<div class="progress-item">
                    <div class="progress-head">
                        <span class="progress-title">${esc(title)}</span>
                        <span class="chip ${stCls}">${esc(stLabel)}</span>
                        ${loc ? `<span class="progress-loc">${esc(loc)}</span>` : ''}
                        ${byNames.length ? `<span class="progress-by">${esc(byNames.join('、'))}</span>` : ''}
                        <span class="progress-count">${sorted.length} 筆紀錄 · ${shots} 張照片</span>
                    </div>
                    <div class="strip">${cells.join('')}</div>
                </div>`;
            }
            box.innerHTML = html;
        }

        function showDetailById(logId) {
            const idx = allLogs.findIndex(l => l.id === logId);
            if (idx >= 0) showDetail(idx);
        }

        function showDetail(index) {
            const log = allLogs[index];
            if (!log) return;

            const modal = document.getElementById('modal');
            const modalShots = document.getElementById('modal-shots');
            const modalDetails = document.getElementById('modal-details');
            if (!modalShots) return;

            // 一筆紀錄可能有多張照片，全部列出來
            // 每張標明是誰上傳的（補拍可以讓別人加到同一筆紀錄）
            const photos = (log.photos && log.photos.length) ? log.photos : [{}];
            modalShots.innerHTML = photos.map(ph => {
                // 日期優先用照片自己的拍攝日期
                const cap = [ph.taken_at || log.log_date, ph.recorder_name, ph.photo_description]
                    .filter(Boolean).join(' · ');
                return `
                        <figure class="modal-shot">
                            <img src="${esc(ph.photo_url) || PLACEHOLDER_MODAL}" alt="">
                            ${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}
                        </figure>`;
            }).join('');

            const fields = {
                '項目': log.item_title,
                '位置': log.node_name || log.location,
                '狀態': STATUS_LABEL[log.item_status || log.progress_status] || '',
                '時間': `${log.log_date || ''} ${log.log_time || ''}`.trim(),
                '紀錄人': log.recorder_name,
                '主描述': log.main_description,
                '發現問題': log.issues_found || '無',
                '待辦事項 / 下一步': log.resolution || '無',
                '備註': log.notes
            };

            modalDetails.innerHTML = Object.entries(fields).map(([label, value]) => `
                        <div class="detail-item">
                            <span class="detail-label">${esc(label)}</span>
                            <span class="detail-value">${esc(value) || '—'}</span>
                        </div>
                    `).join('');

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == document.getElementById('modal')) closeModal();
        }

        fetchLogs();
    </script>
</body>
</html>
