<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郭先生侘寂美學空間 — 工程紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-bg: #f5f0e8;      /* 生成白 */
            --color-text: #3d352d;    /* 墨染灰 */
            --color-accent: #5a4d3f;  /* 焦茶 */
            --color-muted: #a8a29e;
            --font-main: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 4rem 2rem 2rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 0.2rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--color-accent);
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        #timeline {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
        }

        .date-group {
            margin-bottom: 4rem;
        }

        .date-header {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--color-muted);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .date-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--color-muted);
            opacity: 0.3;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .log-card {
            background: transparent;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .log-card:hover {
            transform: translateY(-5px);
        }

        .photo-container {
            aspect-ratio: 4/3;
            overflow: hidden;
            background: #e0dbd5;
            margin-bottom: 1rem;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .log-card:hover img {
            filter: brightness(0.9);
        }

        .log-info {
            font-size: 0.9rem;
        }

        /* 紀錄人（誰上傳的） */
        .log-by {
            display: block;
            font-size: 0.75rem;
            color: #8a8070;
            margin-top: 0.15rem;
        }
        .progress-by {
            font-size: 0.75rem;
            color: #8a8070;
        }

        .log-location {
            font-weight: 500;
            display: block;
            margin-bottom: 0.2rem;
        }

        .log-status {
            font-size: 0.75rem;
            color: var(--color-muted);
            text-transform: uppercase;
        }

        /* 項目進度對照 */
        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1rem;
            color: var(--color-accent);
            margin: 0 0 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--color-muted);
            opacity: 0.85;
        }

        #progress {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .progress-item {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(168, 162, 158, 0.25);
        }

        .progress-head {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .progress-title { font-size: 1.05rem; font-weight: 500; }

        .progress-loc { font-size: 0.8rem; color: var(--color-accent); opacity: 0.75; }

        .progress-count { font-size: 0.75rem; color: var(--color-muted); margin-left: auto; }

        .chip {
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
            border-radius: 10px;
            background: rgba(168, 162, 158, 0.25);
            color: var(--color-accent);
        }
        .chip.opened { background: rgba(61, 53, 45, 0.10); color: #6b6156; }
        .chip.done { background: rgba(107, 142, 92, 0.25); color: #4a6b3d; }

        /* ---------------- 樹狀：狀態 → 工項 → 紀錄 ---------------- */
        .tree-hint { font-size: 0.8rem; color: var(--color-muted); margin: -0.6rem 0 1.4rem; }
        /* 看板：四個狀態**永遠**並排（手機也一樣，不要左右滑） */
        .tree {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
            align-items: start;
        }
        /* 桌面版給看板更多寬度（其餘區塊維持 1000px） */
        @media (min-width: 1001px) { #progress { max-width: 1240px; } }
        .grp {
            padding: 0.4rem 0.9rem 0.9rem;
            border-radius: 6px;
            background: rgba(90, 77, 63, 0.035);
            border: 1px solid rgba(90, 77, 63, 0.10);
        }
        .grp-empty { color: var(--color-muted); font-size: 0.8rem; padding: 0.7rem 0.2rem; }
        /* 窄螢幕：欄位只有 ~90px，全部縮小；摘要用短版（it-meta-short） */
        .it-meta-short { display: none; }
        @media (max-width: 700px) {
            .tree { gap: 0.3rem; }
            .grp { padding: 0.25rem 0.35rem 0.5rem; }
            .grp-head { gap: 0.25rem; padding: 0.4rem 0.1rem; flex-wrap: wrap; }
            .grp-title { font-size: 0.78rem; letter-spacing: 0; line-height: 1.3; }
            .grp-count { font-size: 0.68rem; }
            .grp-caret { display: none; }
            .item-head { padding: 0.5rem 0.05rem; gap: 0.15rem 0.3rem; }
            .it-loc { font-size: 0.68rem; }
            .it-title { font-size: 0.8rem; line-height: 1.35; }
            .it-edit { font-size: 0.68rem; padding: 0.1rem 0.4rem; margin-left: 0; }
            .it-caret { display: none; }
            .chip { font-size: 0.62rem; padding: 0.05rem 0.35rem; }
            .it-meta { display: none; }
            .it-meta-short { display: block; flex-basis: 100%; font-size: 0.62rem; color: var(--color-muted); }
        }
        /* 手機點工項 → 全寬浮層（90px 的欄位裡沒法看照片） */
        #sheet {
            display: none; position: fixed; inset: 0; z-index: 900;
            background: rgba(61, 53, 45, 0.45);
            padding: 1.2rem 0.8rem;
            overflow-y: auto;
        }
        #sheet.open { display: block; }
        .sheet-box {
            background: var(--color-bg); border-radius: 8px;
            max-width: 640px; margin: 0 auto; padding: 1.1rem 1.1rem 1.4rem;
        }
        .sheet-head { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.9rem; }
        .sheet-title { font-size: 1.05rem; font-weight: 500; }
        .sheet-loc { font-size: 0.85rem; color: var(--color-accent); opacity: 0.8; }
        .sheet-close {
            margin-left: auto; border: none; background: none; font-size: 1.3rem;
            cursor: pointer; color: var(--color-muted); line-height: 1;
        }
        .grp-head {
            display: flex; align-items: baseline; gap: 0.6rem;
            padding: 0.5rem 0.2rem;
            border-bottom: 2px solid rgba(90, 77, 63, 0.25);
            cursor: pointer; user-select: none;
        }
        .grp-title { font-size: 1.05rem; font-weight: 500; letter-spacing: 0.06em; }
        .grp-count { font-size: 0.75rem; color: var(--color-muted); }
        .grp-caret { margin-left: auto; font-size: 0.8rem; color: var(--color-muted); transition: transform 0.2s; }
        .grp.collapsed .grp-caret { transform: rotate(-90deg); }
        .grp.collapsed .grp-body { display: none; }

        .item-row { border-bottom: 1px solid rgba(90, 77, 63, 0.12); }
        .item-head {
            display: flex; align-items: center; flex-wrap: wrap; gap: 0.45rem 0.7rem;
            padding: 0.8rem 0.2rem; cursor: pointer;
        }
        .item-head:hover { background: rgba(90, 77, 63, 0.04); }
        .it-loc { font-size: 0.85rem; color: var(--color-accent); opacity: 0.75; }
        .it-title { font-size: 1rem; font-weight: 500; }
        .it-meta { flex-basis: 100%; font-size: 0.75rem; color: var(--color-muted); }
        .it-edit {
            margin-left: auto; font-size: 0.78rem; color: var(--color-accent);
            text-decoration: none; border: 1px solid rgba(90, 77, 63, 0.3);
            border-radius: 999px; padding: 0.15rem 0.65rem;
        }
        .it-caret { font-size: 0.75rem; color: var(--color-muted); transition: transform 0.2s; }
        .item-row.open .it-caret { transform: rotate(90deg); }
        .item-body { display: none; padding: 0.4rem 0.2rem 1.2rem 0.6rem; }
        .item-row.open .item-body { display: block; }

        .rec { border-left: 2px solid rgba(90, 77, 63, 0.18); padding: 0 0 1.1rem 0.9rem; }
        .rec:last-child { padding-bottom: 0.2rem; }
        .rec-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; font-size: 0.78rem; color: var(--color-muted); margin-bottom: 0.45rem; }
        .rec-date { font-weight: 500; color: var(--color-accent); font-size: 0.85rem; }
        .rec-desc { font-size: 0.92rem; margin-bottom: 0.5rem; white-space: pre-wrap; line-height: 1.6; }
        .rec-todo { font-size: 0.82rem; color: var(--color-accent); opacity: 0.85; margin-bottom: 0.5rem; white-space: pre-wrap; }
        .rec .strip { margin-top: 0.2rem; }
        .chip.doing { background: rgba(191, 139, 46, 0.22); color: #8a6a1e; }
        .chip.paused { background: rgba(139, 46, 46, 0.15); color: #8b5454; }

        /* 可左右滑動的照片時間軸 */
        .strip {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.75rem;
            -webkit-overflow-scrolling: touch;
        }

        .shot {
            flex: 0 0 auto;
            width: 200px;
            margin: 0;
            position: relative;
            cursor: pointer;
        }

        .shot img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            display: block;
            background: #e0dbd5;
            transition: filter 0.3s ease;
        }

        .shot:hover img { filter: brightness(0.9); }

        .shot figcaption {
            font-size: 0.72rem;
            color: var(--color-muted);
            margin-top: 0.4rem;
            line-height: 1.35;
        }

        .tag {
            position: absolute;
            top: 0.4rem;
            left: 0.4rem;
            font-size: 0.65rem;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            background: rgba(61, 53, 45, 0.75);
            color: #f5f0e8;
        }
        .tag.latest { background: rgba(107, 142, 92, 0.9); }

        /* Modal 裡的多張照片 */
        .modal-shots { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
        .modal-shot img { width: 100%; max-height: 55vh; object-fit: contain; background: #eee; display: block; }
        .modal-shot figcaption { font-size: 0.8rem; color: var(--color-muted); margin-top: 0.4rem; }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(61, 53, 45, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--color-bg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--color-text);
        }

        .modal-img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #eee;
            margin-bottom: 2rem;
        }

        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .detail-item {
            margin-bottom: 1rem;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--color-muted);
            display: block;
        }

        .detail-value {
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .modal-details { grid-template-columns: 1fr; }
            header { padding: 2rem 1rem 1rem; }
        }

        .loading {
            text-align: center;
            padding: 5rem;
            font-weight: 300;
            color: var(--color-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>郭先生侘寂美學空間</h1>
        <div class="subtitle">工程日誌 — 在不完美中記錄成長</div>
    </header>

    <section id="progress">
        <h2 class="section-title">工程進度</h2>
        <div class="tree-hint">依狀態分組。點工項看每個日期的紀錄與照片。</div>
        <div id="progressList"><div class="loading">正在讀取紀錄...</div></div>
    </section>

    <div id="sheet" onclick="if (event.target === this) closeItemSheet()">
        <div class="sheet-box" id="sheetBox"></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-shots" class="modal-shots"></div>
            <div class="modal-details" id="modal-details"></div>
        </div>
    </div>

    <script>

        // Supabase Configuration
        const SUPABASE_URL = 'https://mnhtegouhzfhigydvgwd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZMU29KQPn0xuBadGJq6Zwg_cHpWe7ZZ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 目前載入的紀錄，供 modal 以索引取用
        // （原本把 JSON.stringify 塞進 onclick 屬性，遇到引號就會壞掉）
        let allLogs = [];

        // 照片已經在 fetchLogs 裡自己接到 log.photos 上（視圖之間沒有外鍵可嵌入）
        function firstPhoto(log) {
            return (log && Array.isArray(log.photos) && log.photos.length)
                ? log.photos[0] : {};
        }

        // 轉義，避免描述裡的 < > & " 破壞版面
        function esc(v) {
            if (v === null || v === undefined) return '';
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        const PLACEHOLDER_CARD = 'https://via.placeholder.com/400x300?text=No+Image';
        const PLACEHOLDER_MODAL = 'https://via.placeholder.com/800x600?text=No+Image';

        // 狀態標籤（公開頁不顯示專案費用與負責人）
        const STATUS_LABEL = { '': '開案', completed: '已完成', in_progress: '進行中', paused: '暫停' };
        const STATUS_CLASS = { '': 'opened', completed: 'done', in_progress: 'doing', paused: 'paused' };

        // 紀錄人是後加的欄位，公開頁用「外掛視圖」讀（v_public_logs_ext / v_public_photos_ext）。
        // SQL 還沒跑的話就自動退回原本的視圖（只是不會顯示紀錄人）—— 不會壞掉，也不需要偵測。
        async function fetchLogs() {
            async function pull(logsView, photosView) {
                const [l, p] = await Promise.all([
                    supabaseClient.from(logsView).select('*').order('log_date', { ascending: false }),
                    supabaseClient.from(photosView).select('*')
                ]);
                return { l, p };
            }
            let { l: logsRes, p: photosRes } = await pull('v_public_logs_ext', 'v_public_photos_ext');
            if (logsRes.error || photosRes.error) {
                ({ l: logsRes, p: photosRes } = await pull('v_public_logs', 'v_public_photos'));
            }
            if (logsRes.error || photosRes.error) {
                console.error('Error fetching logs:', logsRes.error || photosRes.error);
                const msg = '<div class="loading">讀取失敗，請稍後再試。</div>';
                document.getElementById('progressList').innerHTML = msg;
                return;
            }

            // 視圖之間沒有外鍵可以嵌入，所以兩邊各撈一次，在這裡用 log_id 接起來
            const byLog = new Map();
            for (const p of (photosRes.data || [])) {
                if (!byLog.has(p.log_id)) byLog.set(p.log_id, []);
                byLog.get(p.log_id).push(p);
            }
            allLogs = (logsRes.data || []).map(l => ({
                ...l,
                photos: (byLog.get(l.id) || []).sort(photoOrder)
            }));

            renderTree(allLogs);
        }

        // 照片順序：sort_order → 上傳時間 → 檔名裡的毫秒
        // ⚠️ 舊資料的 sort_order 全是 0（不是 null），只比 sort_order 會得到 0 ＝「相等」，
        //    等於沿用 API 回傳的順序 → 卡片上的第一張照片其實是隨機的。
        //    同一批上傳的照片 created_at 也會一模一樣，所以最後再用檔名裡的毫秒決勝。
        function uploadSeq(p) {
            const m = String((p && p.photo_url) || '').match(/\/(\d{13})-[a-z0-9]+\./i);
            return m ? Number(m[1]) : Number.MAX_SAFE_INTEGER;
        }

        function photoOrder(a, b) {
            const sa = (a.sort_order === null || a.sort_order === undefined) ? 0 : a.sort_order;
            const sb = (b.sort_order === null || b.sort_order === undefined) ? 0 : b.sort_order;
            if (sa !== sb) return sa - sb;
            const ca = a.created_at || '', cb = b.created_at || '';
            if (ca !== cb) return ca < cb ? -1 : 1;
            return uploadSeq(a) - uploadSeq(b);
        }

        // ---------------- 樹狀：狀態 → 工項 → 紀錄 ----------------
        // 一個「工項」＝一條時間軸。分組看的是**工項的狀態**（不是單筆紀錄的狀態）。
        const STATUS_ORDER = ['', 'in_progress', 'paused', 'completed'];
        const GROUP_TITLE = { '': '開案（待辦）', in_progress: '進行中', paused: '暫停', completed: '已完成' };
        // 已完成＝做完的，預設收起來，資料多時才找得到東西
        const COLLAPSED_BY_DEFAULT = { completed: true };

        function daysSince(d) {
            if (!d) return null;
            const ms = Date.now() - new Date(String(d) + 'T00:00:00').getTime();
            if (isNaN(ms)) return null;
            return ms < 0 ? 0 : Math.floor(ms / 86400000);
        }

        function fmtMonthDay(d) {
            const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
            return m ? `${Number(m[2])}/${Number(m[3])}` : String(d || '');
        }

        // 待辦事項：一筆紀錄的 resolution 可能是一行一項
        function todoLines(v) {
            if (!v) return [];
            return String(v).split(/\r?\n/)
                .map(s => s.replace(/^[\s\-–—•・*]+/, '').trim())
                .filter(Boolean);
        }

        // 純函式（方便測試）：把紀錄整理成 狀態 → 工項 → 紀錄 三層
        function buildTree(logs) {
            const byItem = new Map();
            for (const l of (logs || [])) {
                if (!l.item_id) continue;
                if (!byItem.has(l.item_id)) byItem.set(l.item_id, []);
                byItem.get(l.item_id).push(l);
            }
            const groups = STATUS_ORDER.map(st => ({ status: st, title: GROUP_TITLE[st], items: [] }));
            const byStatus = new Map(groups.map(g => [g.status, g]));
            for (const [itemId, list] of byItem) {
                // 舊 → 新
                const sorted = [...list].sort((a, b) =>
                    String(a.log_date || '').localeCompare(String(b.log_date || '')));
                const last = sorted[sorted.length - 1];
                const raw = (last.item_status === null || last.item_status === undefined)
                    ? last.progress_status : last.item_status;
                const st = STATUS_ORDER.indexOf(raw) >= 0 ? raw : '';
                let shots = 0;
                for (const l of sorted) shots += (l.photos ? l.photos.length : 0);
                byStatus.get(st).items.push({
                    itemId, status: st,
                    title: last.item_title || '（未命名工項）',
                    loc: last.node_name || last.location || '',
                    logs: sorted, shots,
                    byNames: [...new Set(sorted.map(x => x.recorder_name).filter(Boolean))],
                    opening: sorted[0].log_date || '',
                    days: daysSince(sorted[0].log_date),
                });
            }
            for (const g of groups) {
                // 未完成：開案最久的排上面（放越久越要看到）；已完成：最新的排上面
                g.items.sort((a, b) => g.status === 'completed'
                    ? String(b.opening).localeCompare(String(a.opening))
                    : String(a.opening).localeCompare(String(b.opening)));
            }
            // 看板固定四欄（空的也留著，才看得出整個結構；空欄顯示 0）
            const shown = groups.slice();

            // 沒有指定工項的紀錄（只記現場狀況）也不能消失 —— 收在最後一組，各自一列
            const loose = (logs || []).filter(l => !l.item_id)
                .sort((a, b) => String(b.log_date || '').localeCompare(String(a.log_date || '')));
            if (loose.length) {
                shown.push({
                    status: '_loose', title: '未歸類（只記現場狀況）',
                    items: loose.map(l => ({
                        itemId: 'log:' + l.id, status: '_loose',
                        title: (l.main_description || '').split('\n')[0].slice(0, 24) || '現場狀況',
                        loc: l.node_name || l.location || '',
                        logs: [l], shots: (l.photos ? l.photos.length : 0),
                        byNames: l.recorder_name ? [l.recorder_name] : [],
                        opening: l.log_date || '', days: daysSince(l.log_date),
                    })),
                });
            }
            return shown;
        }

        function shotFigure(ph, log) {
            const cap = [ph.taken_at || log.log_date, ph.recorder_name || log.recorder_name,
                         ph.photo_description].filter(Boolean).join(' · ');
            return `<figure class="shot" onclick="showDetailById('${esc(log.id)}')">
                <img src="${esc(ph.photo_url)}" loading="lazy" alt="">
                <figcaption>${esc(cap)}</figcaption>
            </figure>`;
        }

        function recBlock(log) {
            const photos = log.photos || [];
            const st = log.progress_status;
            const todo = todoLines(log.resolution);
            return `<div class="rec">
                <div class="rec-head">
                    <span class="rec-date">${esc(log.log_date) || '未標記日期'}</span>
                    ${st ? `<span class="chip ${STATUS_CLASS[st] || ''}">${esc(STATUS_LABEL[st] || '')}</span>` : ''}
                    ${log.recorder_name ? `<span class="rec-by">紀錄：${esc(log.recorder_name)}</span>` : ''}
                    ${photos.length ? `<span class="rec-shots">${photos.length} 張照片</span>` : ''}
                </div>
                ${log.main_description ? `<div class="rec-desc">${esc(log.main_description)}</div>` : ''}
                ${todo.length ? `<div class="rec-todo">待辦：${esc(todo.join('、'))}</div>` : ''}
                ${photos.length ? `<div class="strip">${photos.map(ph => shotFigure(ph, log)).join('')}</div>` : ''}
            </div>`;
        }

        function itemRow(it) {
            const meta = [];
            if (it.opening) meta.push(fmtMonthDay(it.opening) + ' 開案');
            if (it.status !== 'completed' && it.days !== null) meta.push('已 ' + it.days + ' 天');
            meta.push(it.logs.length + ' 筆紀錄 · ' + it.shots + ' 張照片');
            if (it.byNames.length) meta.push(it.byNames.join('、'));
            // 窄螢幕（欄位 ~90px）用短版摘要，不然整段文字會折成一團
            const short = `${fmtMonthDay(it.opening)} · ${it.logs.length}筆/${it.shots}張`;
            return `<div class="item-row" data-item="${esc(it.itemId)}" onclick="toggleItem(this)">
                <div class="item-head">
                    ${it.loc ? `<span class="it-loc">${esc(it.loc)}</span>` : ''}
                    <span class="it-title">${esc(it.title)}</span>
                    ${it.status !== '_loose'
                        ? `<span class="chip ${STATUS_CLASS[it.status] || ''}">${esc(STATUS_LABEL[it.status] || '開案')}</span>`
                        : ''}
                    <a class="it-edit" href="entries.html" onclick="event.stopPropagation()">✎ 編輯</a>
                    <span class="it-caret">▸</span>
                    <div class="it-meta">${esc(meta.join(' · '))}</div>
                    <div class="it-meta-short">${esc(short)}</div>
                </div>
                <div class="item-body">${it.logs.map(recBlock).join('')}</div>
            </div>`;
        }

        function renderTree(logs) {
            const box = document.getElementById('progressList');
            if (!box) return;
            const groups = buildTree(logs);
            LAST_TREE = groups;
            if (!groups.length) {
                box.innerHTML = '<div class="loading">還沒有指定工項的紀錄。</div>';
                return;
            }
            box.innerHTML = `<div class="tree">${groups.map(g => `
                <div class="grp${COLLAPSED_BY_DEFAULT[g.status] ? ' collapsed' : ''}">
                    <div class="grp-head" onclick="toggleGroup(this)">
                        <span class="grp-title">${esc(g.title)}</span>
                        <span class="grp-count">${g.items.length}</span>
                        <span class="grp-caret">▾</span>
                    </div>
                    <div class="grp-body">${g.items.length
                        ? g.items.map(itemRow).join('')
                        : '<div class="grp-empty">—</div>'}</div>
                </div>`).join('')}</div>`;
        }

        function toggleGroup(el) {
            const grp = el.closest('.grp');
            if (grp) grp.classList.toggle('collapsed');
        }

        // 目前在畫面上的樹（點工項時要查它的紀錄）
        let LAST_TREE = [];
        // 窄螢幕門檻：欄位太窄就在展開沒意義 → 改用全寬浮層
        const SHEET_MAX = 700;

        function toggleItem(row) {
            if (!row) return;
            if (window.innerWidth <= SHEET_MAX) return openItemSheet(row.getAttribute('data-item'));
            row.classList.toggle('open');
        }

        function findItem(itemId) {
            for (const g of LAST_TREE) {
                const it = g.items.find(x => x.itemId === itemId);
                if (it) return { grp: g, it };
            }
            return null;
        }

        function itemChip(it, grp) {
            if (it.status === '_loose') return `<span class="chip">${esc(grp.title)}</span>`;
            return `<span class="chip ${STATUS_CLASS[it.status] || ''}">`
                + `${esc(STATUS_LABEL[it.status] || '開案')}</span>`;
        }

        // 手機點工項 → 全寬浮層（照片才看得清楚）
        function openItemSheet(itemId) {
            const found = findItem(itemId);
            const box = document.getElementById('sheetBox');
            if (!found || !box) return;
            const { grp, it } = found;
            const meta = [
                it.opening ? fmtMonthDay(it.opening) + ' 開案' : '',
                it.logs.length + ' 筆紀錄 · ' + it.shots + ' 張照片',
                it.byNames.join('、'),
            ].filter(Boolean).join(' · ');
            box.innerHTML = `
                <div class="sheet-head">
                    <span class="sheet-title">${esc(it.title)}</span>
                    ${it.loc ? `<span class="sheet-loc">${esc(it.loc)}</span>` : ''}
                    ${itemChip(it, grp)}
                    <button class="sheet-close" onclick="closeItemSheet()">&times;</button>
                </div>
                <div class="it-meta" style="display:block;margin-bottom:1rem">${esc(meta)}</div>
                ${it.logs.map(recBlock).join('')}
                <a class="it-edit" href="entries.html" style="display:inline-block">✎ 編輯這個工項</a>`;
            document.getElementById('sheet').classList.add('open');
        }

        function closeItemSheet() {
            document.getElementById('sheet').classList.remove('open');
        }

        function showDetailById(logId) {
            const idx = allLogs.findIndex(l => l.id === logId);
            if (idx >= 0) showDetail(idx);
        }

        function showDetail(index) {
            const log = allLogs[index];
            if (!log) return;

            const modal = document.getElementById('modal');
            const modalShots = document.getElementById('modal-shots');
            const modalDetails = document.getElementById('modal-details');
            if (!modalShots) return;

            // 一筆紀錄可能有多張照片，全部列出來
            // 每張標明是誰上傳的（補拍可以讓別人加到同一筆紀錄）
            const photos = (log.photos && log.photos.length) ? log.photos : [{}];
            modalShots.innerHTML = photos.map(ph => {
                // 日期優先用照片自己的拍攝日期
                const cap = [ph.taken_at || log.log_date, ph.recorder_name, ph.photo_description]
                    .filter(Boolean).join(' · ');
                return `
                        <figure class="modal-shot">
                            <img src="${esc(ph.photo_url) || PLACEHOLDER_MODAL}" alt="">
                            ${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}
                        </figure>`;
            }).join('');

            const fields = {
                '項目': log.item_title,
                '位置': log.node_name || log.location,
                '狀態': STATUS_LABEL[log.item_status || log.progress_status] || '',
                '時間': `${log.log_date || ''} ${log.log_time || ''}`.trim(),
                '紀錄人': log.recorder_name,
                '主描述': log.main_description,
                '發現問題': log.issues_found || '無',
                '待辦事項 / 下一步': log.resolution || '無',
                '備註': log.notes
            };

            modalDetails.innerHTML = Object.entries(fields).map(([label, value]) => `
                        <div class="detail-item">
                            <span class="detail-label">${esc(label)}</span>
                            <span class="detail-value">${esc(value) || '—'}</span>
                        </div>
                    `).join('');

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == document.getElementById('modal')) closeModal();
        }

        fetchLogs();
    </script>
</body>
</html>
